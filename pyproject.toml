[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-rl"
version = "0.1.0"
description = "Chess environment and training code for an RL / GAN chess bot"
readme = "Readme.md"
requires-python = ">=3.10"
dependencies = [
    "chess>=1.11",
    "gymnasium>=1.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
chess-play = "chess_env.play:main"

[tool.setuptools.packages.find]
include = ["chess_env*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
